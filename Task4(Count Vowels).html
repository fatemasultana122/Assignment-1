<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Count Vowels App</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    /* Background animation */
    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .animated-bg {
      background: linear-gradient(-45deg, #0f172a, #1e293b, #0ea5e9, #0f172a);
      background-size: 400% 400%;
      animation: bgMove 12s ease infinite;
    }

    /* Card float */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .float {
      animation: float 4s ease-in-out infinite;
    }

    /* Fade result */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0px); }
    }

    .fade {
      animation: fadeIn 0.4s ease;
    }
  </style>
</head>

<body class="animated-bg min-h-screen flex items-center justify-center px-4">

  <!-- Card -->
  <div class="float w-full max-w-md bg-white/10 backdrop-blur-2xl border border-white/20 rounded-3xl shadow-2xl p-8">

    <!-- Title -->
    <h1 class="text-3xl font-extrabold text-white text-center">
      Count Vowels
    </h1>

    <p class="text-slate-300 text-center mt-2 mb-6">
      Enter text to count vowels (a, e, i, o, u)
    </p>

    <!-- Input -->
    <input
      type="text"
      id="textInput"
      placeholder="Type something..."
      class="w-full p-4 rounded-2xl bg-white/10 text-white placeholder-slate-300 border border-white/20 focus:ring-2 focus:ring-cyan-400 outline-none transition"
    />

    <!-- Button -->
    <button
      onclick="showVowelCount()"
      class="w-full mt-4 py-4 rounded-2xl bg-gradient-to-r from-cyan-400 to-blue-500 text-white font-bold text-lg shadow-lg hover:scale-105 active:scale-95 transition duration-300"
    >
      🔥 Count Vowels
    </button>

    <!-- Result -->
    <div class="mt-6 text-center">
      <p class="text-slate-300 mb-2">Total Vowels</p>

      <div
        id="result"
        class="fade text-5xl font-extrabold text-green-400 bg-black/20 border border-white/10 rounded-2xl py-4"
      >
        0
      </div>
    </div>

  </div>

  <!-- JavaScript -->
  <script>

    function countVowels(str) {
      let count = 0;
      let vowels = "aeiouAEIOU";

      for (let char of str) {
        if (vowels.includes(char)) {
          count++;
        }
      }

      return count;
    }

    function showVowelCount() {

      let input = document.getElementById("textInput").value;

      let result = countVowels(input);

      let box = document.getElementById("result");
      box.innerText = result;

      // restart animation
      box.classList.remove("fade");
      void box.offsetWidth;
      box.classList.add("fade");
    }

  </script>

</body>
</html>
