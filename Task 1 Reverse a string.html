<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reverse String App</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body{
      font-family: 'Poppins', sans-serif;
    }

    /* Floating Animation */
    @keyframes float {
      0%,100%{
        transform: translateY(0px);
      }
      50%{
        transform: translateY(-12px);
      }
    }

    .float-animation{
      animation: float 4s ease-in-out infinite;
    }

    /* Glow Animation */
    @keyframes glow {
      0%{
        box-shadow: 0 0 10px rgba(59,130,246,0.4);
      }
      50%{
        box-shadow: 0 0 30px rgba(59,130,246,0.8);
      }
      100%{
        box-shadow: 0 0 10px rgba(59,130,246,0.4);
      }
    }

    .glow{
      animation: glow 3s infinite;
    }

    /* Result Animation */
    @keyframes pop {
      0%{
        transform: scale(0.7);
        opacity: 0;
      }
      100%{
        transform: scale(1);
        opacity: 1;
      }
    }

    .animate-pop{
      animation: pop 0.4s ease;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-blue-900 to-indigo-900 overflow-hidden">

  <!-- Background Blur Circles -->
  <div class="absolute w-72 h-72 bg-blue-500 rounded-full blur-3xl opacity-30 top-10 left-10"></div>
  <div class="absolute w-72 h-72 bg-purple-500 rounded-full blur-3xl opacity-30 bottom-10 right-10"></div>

  <!-- Card -->
  <div class="relative z-10 w-[400px] backdrop-blur-xl bg-white/10 border border-white/20 rounded-3xl p-8 shadow-2xl text-center float-animation glow">

    <!-- Icon -->
    <div class="w-20 h-20 mx-auto mb-5 rounded-full bg-gradient-to-r from-blue-500 to-cyan-400 flex items-center justify-center text-white text-4xl shadow-lg">
      🔄
    </div>

    <!-- Title -->
    <h1 class="text-4xl font-bold text-white mb-2">
      Reverse String
    </h1>

    <p class="text-gray-300 mb-8">
      Type anything and reverse it instantly
    </p>

    <!-- Input -->
    <input
      type="text"
      id="inputText"
      placeholder="Enter your text..."
      class="w-full px-5 py-4 rounded-2xl bg-white/20 text-white placeholder-gray-300 border border-white/20 focus:outline-none focus:ring-4 focus:ring-blue-400 transition duration-300"
    >

    <!-- Button -->
    <button
      onclick="showReverse()"
      class="mt-5 w-full bg-gradient-to-r from-blue-500 to-cyan-400 text-white py-4 rounded-2xl font-semibold text-lg hover:scale-105 hover:shadow-2xl transition duration-300 active:scale-95"
    >
      Reverse Now
    </button>

    <!-- Result -->
    <div class="mt-8">
      <h2 class="text-xl text-white font-semibold mb-3">
        Result
      </h2>

      <div class="bg-white/10 border border-white/10 rounded-2xl p-4 min-h-[70px] flex items-center justify-center">
        <p id="result" class="text-cyan-300 text-2xl font-bold break-words"></p>
      </div>
    </div>

  </div>

  <!-- JavaScript -->
  <script>

    function reverseString(str) {
      return str.split('').reverse().join('');
    }

    function showReverse() {

      let input = document.getElementById("inputText").value;

      let reversed = reverseString(input);

      let result = document.getElementById("result");

      result.innerText = reversed;

      // Animation restart
      result.classList.remove("animate-pop");

      void result.offsetWidth;

      result.classList.add("animate-pop");
    }

  </script>

</body>
</html>
