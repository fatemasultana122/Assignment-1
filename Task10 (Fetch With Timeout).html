<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fetch With Timeout</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    /* Animated background */
    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .animated-bg {
      background: linear-gradient(-45deg, #0f172a, #1e293b, #0ea5e9, #0f172a);
      background-size: 400% 400%;
      animation: bgMove 12s ease infinite;
    }

    /* Floating card */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .float {
      animation: float 4s ease-in-out infinite;
    }

    /* Fade animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0px); }
    }

    .fade {
      animation: fadeIn 0.4s ease;
    }

    /* Pulse loading */
    @keyframes pulseSoft {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .pulse {
      animation: pulseSoft 1.2s infinite;
    }
  </style>
</head>

<body class="animated-bg min-h-screen flex items-center justify-center px-4">

  <!-- Card -->
  <div class="float w-full max-w-lg bg-white/10 backdrop-blur-2xl border border-white/20 rounded-3xl shadow-2xl p-8">

    <!-- Title -->
    <h1 class="text-3xl font-extrabold text-white text-center mb-2">
      Fetch With Timeout
    </h1>

    <p class="text-slate-300 text-center mb-6">
      API request with timeout protection ⚡
    </p>

    <!-- URL Input -->
    <input
      id="urlInput"
      type="text"
      value="https://jsonplaceholder.typicode.com/todos/1"
      class="w-full p-4 rounded-2xl bg-white/10 text-white placeholder-slate-300 border border-white/20 focus:ring-2 focus:ring-cyan-400 outline-none transition mb-4"
    />

    <!-- Timeout Input -->
    <input
      id="timeoutInput"
      type="number"
      value="2000"
      class="w-full p-4 rounded-2xl bg-white/10 text-white placeholder-slate-300 border border-white/20 focus:ring-2 focus:ring-cyan-400 outline-none transition mb-4"
    />

    <!-- Button -->
    <button
      onclick="fetchData()"
      class="w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-400 to-blue-500 text-black font-bold text-lg shadow-lg hover:scale-105 active:scale-95 transition duration-300"
    >
      ⚡ Fetch Data
    </button>

    <!-- Result -->
    <div class="mt-6 text-center">

      <p class="text-slate-300 mb-2">Result</p>

      <pre
        id="result"
        class="fade bg-black/20 border border-white/10 rounded-2xl p-4 text-cyan-300 text-sm overflow-auto text-left h-64"
      >
Output will appear here...
      </pre>

    </div>

  </div>

  <!-- JS -->
  <script>

    function fetchWithTimeout(url, ms) {

      return Promise.race([

        fetch(url),

        new Promise((_, reject) =>
          setTimeout(() => reject(new Error("Request Timed Out ⏳")), ms)
        )
      ]);
    }

    async function fetchData() {

      const url = document.getElementById("urlInput").value;
      const timeout = Number(document.getElementById("timeoutInput").value);

      const resultBox = document.getElementById("result");

      resultBox.innerText = "Loading...";

      try {

        const response = await fetchWithTimeout(url, timeout);
        const data = await response.json();

        resultBox.innerText = JSON.stringify(data, null, 2);

      } catch (error) {

        resultBox.innerText = error.message;
      }

      // restart animation
      resultBox.classList.remove("fade");
      void resultBox.offsetWidth;
      resultBox.classList.add("fade");
    }

  </script>

</body>
</html>
